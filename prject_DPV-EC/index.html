<!doctype html>
<html lang="en">

<head>
  <script>
    (function () {
      try {
        var fs = localStorage.getItem('cosy-font-size') || '14px';
        var th = localStorage.getItem('cosy-theme') || 'dark';
        var doc = document.documentElement;
        if (doc && doc.style) doc.style.setProperty('--font-size', fs);
        if (doc && doc.classList) {
          doc.classList.remove('cosy-theme-dark', 'cosy-theme-light');
          doc.classList.add('cosy-theme-' + th);
        }
      } catch (e) { }
    })();
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/prject_DPV-EC/可视化.svg" />
  <link rel="shortcut icon" type="image/svg+xml" href="/prject_DPV-EC/可视化.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电商销售数据数据分析及可视化</title>
  <script type="module" crossorigin src="/prject_DPV-EC/assets/index-CxROHVwW.js"></script>
  <link rel="stylesheet" crossorigin href="/prject_DPV-EC/assets/index-CJlAztla.css">

  <!-- 修复资源路径的脚本 -->
  <script>
    // 重写fetch函数来修复JSON文件路径
    const originalFetch = window.fetch;
    window.fetch = function (url, options) {
      // 如果是JSON文件且路径以/开头，添加项目路径前缀
      if (typeof url === 'string' && url.endsWith('.json') && url.startsWith('/')) {
        url = '/prject_DPV-EC' + url;
      }
      return originalFetch.call(this, url, options);
    };
  </script>

  <!-- 运行时路径修复：处理 file:// 打开或子路径托管导致的资源 404 -->
  <script>
    (function () {
      function ensureRelative(p) {
        if (!p) return p;
        // 如果以 / 开头，转换为相对路径（file:// 或解压场景）
        if (p.charAt(0) === '/') return '.' + p;
        return p;
      }

      // 在本地以 file:// 打开时，或希望兼容解压后的静态文件夹，修正 img/script/link 的路径
      if (location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
          // 修正 img src
          document.querySelectorAll('img').forEach(function (img) {
            try {
              var s = img.getAttribute('src');
              if (!s) return;
              // 如果是绝对路径或直接以 analysis_results 开头，转换为相对路径
              if (s.charAt(0) === '/' || s.indexOf('analysis_results') === 0) {
                img.src = ensureRelative(s);
              }
            } catch (e) { }
          });

          // 修正 link[href] 和 script[src]
          document.querySelectorAll('link[rel="stylesheet"]').forEach(function (ln) {
            try {
              var h = ln.getAttribute('href');
              if (!h) return;
              if (h.charAt(0) === '/') ln.href = ensureRelative(h);
            } catch (e) { }
          });

          document.querySelectorAll('script').forEach(function (sc) {
            try {
              var src = sc.getAttribute('src');
              if (!src) return;
              if (src.charAt(0) === '/') sc.src = ensureRelative(src);
            } catch (e) { }
          });
        });
      } else {
        // 运行在 http(s) 下：若页面位于子路径（如 /prject_DPV-EC/），但资源仍以根路径请求（/analysis_results/...），
        // 可选择在这里自动把以 "/analysis_results" 开头的请求重写为带项目子路径的路径。
        var subPath = location.pathname.split('/').filter(Boolean)[0];
        if (subPath && subPath !== 'index.html') {
          // 延迟修正，避免阻塞加载
          document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('img').forEach(function (img) {
              try {
                var s = img.getAttribute('src');
                if (!s) return;
                if (s.charAt(0) === '/') img.src = '/' + subPath + s;
              } catch (e) { }
            });
          });
        }
      }
    })();
  </script>

  <!-- CSS隔离样式，防止被Hexo主题覆盖 -->
  <style>
    /* 重置所有继承的样式 */
    body {
      margin: 0 !important;
      padding: 0 !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif !important;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
      background: #ffffff !important;
      color: #333333 !important;
    }

    /* 确保Vue应用容器不受影响 - 保持原有样式 */
    #app {
      max-width: 1280px !important;
      margin: 0 auto !important;
      padding: 2rem !important;
      text-align: center !important;
    }

    /* 重置所有可能的主题样式 */
    * {
      box-sizing: border-box !important;
    }

    /* 确保图表容器不受影响 */
    .echarts-container,
    .chart-container {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>
  <div id="app"></div>
</body>

</html>
